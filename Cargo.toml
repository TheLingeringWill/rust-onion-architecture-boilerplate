[package]
name = "foo-service"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aws-config = { version = "1.11", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.144"
aws-sdk-sqs = "1.108"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.12", features = ["chrono", "serde_json"] }
diesel-async = { version = "0.9.2", features = ["postgres", "bb8"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trait-variant = "0.1.3"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[workspace.metadata.clippy]
allow = ["large_enum_variant"]
